<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ComandaPro | Gestão</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-icon">CP</div>
      <div>
        <b>ComandaPro</b>
        <small>GESTÃO DE OPERAÇÃO</small>
      </div>
    </div>
    <div class="nav-label">OPERAÇÃO</div>
    <button class="nav active" data-page="dashboard"><span>◫</span> Visão geral</button>
    <button class="nav" data-page="pdv"><span>▦</span> Frente de caixa <em>PDV</em></button>
    <button class="nav" data-page="comandas"><span>▤</span> Comandas</button>
    <button class="nav" data-page="encomendas"><span>▣</span> Encomendas</button>
    <div class="nav-label">CADASTROS</div>
    <button class="nav" data-page="clientes"><span>♙</span> Clientes</button>
    <button class="nav" data-page="produtos"><span>◈</span> Produtos</button>
    <button class="nav" data-page="estoque"><span>▥</span> Estoque</button>
    <button class="nav" data-page="precos"><span>＄</span> Preços</button>
    <button class="nav" data-page="cartoes"><span>▣</span> Cartões</button>
    <div class="nav-label">ANÁLISES</div>
    <button class="nav" data-page="relatorios"><span>▤</span> Relatórios</button>
    <button class="nav" data-page="alertas"><span>⚑</span> Alertas de estoque</button>
    <div class="sidebar-bottom">
      <div class="status-dot"></div>
      <div>
        <b>Banco de dados</b>
        <small id="db-status">Verificando conexão...</small>
      </div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div class="crumb">Sistema <span>/</span> <b id="crumb-title">Visão geral</b></div>
      <div class="top-actions">
        <span class="today" id="today"></span>
        <div class="avatar">OP</div>
      </div>
    </header>
    <div class="content">
      <div id="page"></div>
    </div>
  </main>
</div>
<div id="toast" class="toast"></div>
<div id="modal-root"></div>
<script src="js/app.js"></script>
</body>
</html>
